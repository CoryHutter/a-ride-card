<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your Invoice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--bg:#F4F4F2;--card:#FFFFFF;--ink:#16181C;--muted:#6B7079;--line:#E2E3E0;--acc:#E8742A}
@media (prefers-color-scheme: dark){:root{--bg:#121417;--card:#1C1F24;--ink:#EEF0F3;--muted:#979DA8;--line:#2E333B}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:620px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 18px;margin-bottom:14px}
.top{border-top:5px solid var(--acc)}
h1{font-family:"Barlow Condensed",Impact,sans-serif;font-size:30px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.02em}
.shopline{color:var(--muted);font-size:13px;margin-top:6px}
.shopline a{color:inherit}
.meta{display:flex;justify-content:space-between;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);flex-wrap:wrap}
.meta b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:500}
.status{display:inline-block;margin-top:12px;padding:5px 11px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--acc);color:#111}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}
.kv span{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
h2{font-family:"Barlow Condensed",sans-serif;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.ln{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ln:last-child{border-bottom:0}
.ln .d{font-size:14.5px}
.ln .s{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted)}
.ln .a{font-family:"IBM Plex Mono",monospace;font-size:14.5px;text-align:right;grid-row:1 / span 2;grid-column:2;align-self:center}
.tr{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:3px 0}
.tr b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:500}
.grand{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:10px;border-top:2px solid var(--acc)}
.grand span{font-family:"Barlow Condensed",sans-serif;font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.grand b{font-family:"Barlow Condensed",sans-serif;font-size:40px;line-height:1}
.policy{font-size:13.5px;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns a,.btns button{flex:1;min-width:140px;text-align:center;padding:12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btns .primary{background:var(--acc);border-color:var(--acc);color:#111}
.msg{text-align:center;padding:60px 16px;color:var(--muted)}
.msg b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:24px;color:var(--ink);margin-bottom:6px;text-transform:uppercase}
.foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:18px}
@media print{.btns,.foot{display:none}body{background:#fff;color:#000}.card{border-color:#ccc}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Loading your invoice&hellip;</div></div>
<script>
const $ = id => document.getElementById(id);
const money = n => '$' + (Math.round((n || 0) * 100) / 100).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CFG = window.TAPLOG || {shop:{}};
if(CFG.shop && CFG.shop.accent) document.documentElement.style.setProperty('--acc', CFG.shop.accent);

function fromB64url(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '=';
  return decodeURIComponent(escape(atob(s)));
}
async function load(){
  const qs = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.slice(1));
  if(hash.get('d')){
    const c = JSON.parse(fromB64url(hash.get('d')));
    c.lines = (c.lines || []).map(l => Array.isArray(l) ? {sku:l[0], d:l[1], qty:l[2], unit:l[3], amt:l[4], labor:!!l[5]} : l);
    return c;
  }
  const id = qs.get('t');
  const w = (qs.get('w') || CFG.worker || '').replace(/\/+$/, '');
  if(!id || !w) throw new Error('This link is missing its invoice number.');
  if(!/^(https:\/\/[a-z0-9.-]+|http:\/\/localhost:\d+)$/i.test(w)) throw new Error('This link looks damaged.');
  const r = await fetch(w + '/api/invoice/' + encodeURIComponent(id));
  if(r.status === 404) throw new Error('We couldn’t find this invoice. Please call the shop.');
  if(!r.ok) throw new Error('The invoice couldn’t load right now. Try again in a minute.');
  return r.json();
}
function show(t){
  const s = t.shop || {}, tot = t.totals || {}, cust = t.customer || {};
  document.title = (s.name || 'Shop') + ' — Invoice ' + (t.no || '');
  const tel = s.phone ? s.phone.replace(/[^0-9+]/g, '') : '';
  const parts = (t.lines || []).filter(l => !l.labor), labor = (t.lines || []).filter(l => l.labor);
  const lineHtml = l => '<div class="ln"><div class="d">' + esc(l.d) + '</div><div class="a">' + money(l.amt) + '</div>' +
    '<div class="s">' + (l.sku ? esc(l.sku) + ' · ' : '') + esc(l.qty) + ' × ' + money(l.unit) + '</div></div>';
  $('app').innerHTML =
    '<div class="card top"><h1>' + esc(s.name || 'Invoice') + '</h1>' +
      '<div class="shopline">' + [s.address ? esc(s.address) : '', s.phone ? '<a href="tel:' + esc(tel) + '">' + esc(s.phone) + '</a>' : ''].filter(Boolean).join(' &middot; ') + '</div>' +
      (t.status ? '<div class="status">' + esc(t.status) + '</div>' : '') +
      '<div class="meta"><span>Invoice <b>' + esc(t.no || '') + '</b></span><span>' +
        (t.saved ? new Date(t.saved).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'}) : '') + '</span></div></div>' +
    '<div class="card"><div class="kv">' +
      (cust.name ? '<span>Customer</span><div>' + esc(cust.name) + '</div>' : '') +
      (t.bike ? '<span>Bike</span><div>' + esc(t.bike) + '</div>' : '') +
      (t.notes ? '<span>Work</span><div>' + esc(t.notes) + '</div>' : '') +
    '</div></div>' +
    (labor.length ? '<div class="card"><h2>Labor</h2>' + labor.map(lineHtml).join('') + '</div>' : '') +
    (parts.length ? '<div class="card"><h2>Parts</h2>' + parts.map(lineHtml).join('') + '</div>' : '') +
    '<div class="card">' +
      '<div class="tr"><span>Parts</span><b>' + money(tot.parts) + '</b></div>' +
      '<div class="tr"><span>Labor</span><b>' + money(tot.labor) + '</b></div>' +
      (tot.disc ? '<div class="tr"><span>Parts discount (' + esc(tot.discPct) + '%)</span><b>-' + money(tot.disc) + '</b></div>' : '') +
      (tot.supplies ? '<div class="tr"><span>Shop supplies</span><b>' + money(tot.supplies) + '</b></div>' : '') +
      '<div class="tr"><span>Sales tax' + (tot.taxRate != null ? ' (' + esc(tot.taxRate) + '%)' : '') + '</span><b>' + money(tot.tax) + '</b></div>' +
      '<div class="grand"><span>Total due</span><b>' + money(tot.total) + '</b></div>' +
    '</div>' +
    (t.policy ? '<div class="card policy">' + esc(t.policy) + '</div>' : '') +
    '<div class="btns">' + (tel ? '<a class="primary" href="tel:' + esc(tel) + '">Call the shop</a>' : '') +
      '<button onclick="window.print()">Save / print</button></div>' +
    '<div class="foot">Service record by TapLog</div>';
}
load().then(show).catch(e => {
  $('app').innerHTML = '<div class="msg"><b>Invoice not available</b>' + esc(e.message) + '</div>';
});
</script>
</body>
</html>
