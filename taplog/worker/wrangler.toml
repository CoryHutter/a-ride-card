name = "taplog-shop"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGIN = "https://coryhutter.github.io"

# Paste the KV namespace id Cloudflare gives you (see SETUP.md, step 3)
[[kv_namespaces]]
binding = "TICKETS"
id = "PASTE_KV_ID_HERE"

# Secrets are NOT stored here. Set them in the Cloudflare dashboard:
#   ADMIN_KEY  (Cory's password for admin.html, where shops are added)
#   MASTER_KEY (a long random phrase that locks every shop's keys; never change it)
# Optional, the original one-shop setup (still works):
#   WPS_TOKEN, SHOP_KEY
