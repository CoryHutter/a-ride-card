.rp .top .id{font-size:12px;font-weight:600;color:#bdbdbd;white-space:nowrap}
.rp .board{background:#0b0b0b;color:#fff;border-radius:4px;border:6px solid #f5f5f5;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.rp .riderb{padding:18px;gap:6px}
.rp .lab{font-size:12px;font-weight:600;letter-spacing:.14em;color:#bdbdbd}
.rp .name{font-family:'Anton',Impact,sans-serif;font-size:56px;line-height:.95;text-transform:uppercase;overflow-wrap:anywhere}
.rp .bikeline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:16px}
.rp .badge{background:#f6e600;color:#0b0b0b;font-family:'Anton',Impact,sans-serif;font-size:20px;padding:2px 10px;border-radius:3px}
.rp .vin{font-size:12px;color:#bdbdbd}
.rp .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rp .tile{background:#f5f5f5;border-radius:4px;padding:10px;min-width:0}
.rp .tile span{display:block;font-size:12px;font-weight:600;color:#555555}
.rp .tile b{display:block;font-weight:800;font-size:18px}
.rp .tile b.gold{color:#0b0b0b}
.rp .bhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rp .bhead .t{font-family:'Anton',Impact,sans-serif;font-size:30px;color:#ffffff}
.rp .bhead .m{font-size:13px;color:#bdbdbd}
.rp .bigs{display:grid;gap:10px}
.rp .big{border-top:2px solid #3a3a3a;padding-top:6px;min-width:0}
.rp .big span{display:block;font-size:13px;color:#bdbdbd;font-weight:800;letter-spacing:.04em}
.rp .big b{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:34px;line-height:1.05}
.rp .big small{font-size:13px;margin-left:3px}
.rp .rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));row-gap:8px;column-gap:10px;font-size:16px;border-top:2px solid #3a3a3a;padding-top:10px}
.rp .rows span{color:#bdbdbd;font-weight:800}
.rp .rows b{text-align:right;color:#fff200}
.rp .big b{color:#fff200}
.rp .foot{font-size:12px;color:#bdbdbd}
.rp .bnote{border-top:2px solid #3a3a3a;padding-top:10px;font-size:15px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.rp .bnote span{display:block;font-size:12px;font-weight:600;letter-spacing:.14em;color:#f6e600;margin-bottom:4px}
.rp .log{background:#f5f5f5;border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.rp .loghead{background:#f6e600;color:#0b0b0b;padding:10px 16px;display:flex;justify-content:space-between;align-items:baseline}
.rp .loghead .t{font-family:'Anton',Impact,sans-serif;font-size:22px;letter-spacing:.03em}
.rp .loghead span{font-size:12px;font-weight:600}
.rp .entry{padding:14px 16px;display:flex;flex-direction:column;gap:4px;font-size:15px;border-top:2px solid #dddddd}
.rp .entry:first-of-type{border-top:0}
.rp .entry .r{display:flex;justify-content:space-between;gap:12px}
.rp .entry .r span:last-child{text-align:right;white-space:nowrap}
.rp .entry .d{color:#555555}
.rp .entry p{margin:2px 0 0;color:#555555;font-size:14px;white-space:pre-line}

  var covers = D.covers || 'both';
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }

  root.textContent = '';

  var label = D.bikeLabel || '', letter = '';

      b.appendChild(g);

    if (rowList.length) {
