html,body{margin:0;background:#c7cfd9}</style></head><body><div id="app"></div><script type="application/json" id="ride-data">{"rider":"Murphy Hutter","entryId":"KTM85-014-B","bike":"2026 KTM 85 SX · big wheel","bikeYear":"2026","bikeMake":"KTM","bikeModel":"85 SX","bikeExtra":"big wheel","bikeLabel":"Race bike (B)","vin":"123456","covers":"both","weight":"105 lb","date":"Oct 23, 2026","phone":"","fork":{"model":"WP XACT 43 mm","spring":"4.6","springUnit":"N/mm","oilLevel":"100","oilLevelUnit":"mm","comp":"12","reb":"14","setHeight":"Flush","preload":"5","preloadUnit":"mm"},"shock":{"model":"WP XACT","spring":"53","springUnit":"N/mm","raceSag":"88","compLow":"14","reb":"12","preload":"8","compHigh":"1.5"},"history":[{"date":"Oct 18, 2026","title":"Springs + revalve for rider weight","note":"Rider gained 12 lb since spring.\nGood all-round setting for hardpack and intermediate. For deep sand, go 2 clicks firmer on fork and shock compression.","changes":[{"label":"Fork spring rate","from":"4.4","to":"4.6","unit":"N/mm"},{"label":"Fork oil level","from":"110","to":"100","unit":"mm"},{"label":"Shock spring rate","from":"50","to":"53","unit":"N/mm"}]}],"slug":"k7x2qm","trackType":"MX"}</script><script>function renderRiderPage(D, root) {
  var covers = D.covers || 'both';

  root.textContent = '';
  var wrap = el('div', 'rp');
  var top = el('div', 'top'); var logo = el('div', 'logo', 'A-RIDE '); logo.appendChild(el('span', null, 'SUSPENSION'));
  top.append(logo, el('div', 'id', D.entryId || '')); wrap.appendChild(top);
  // rider board
  var rb = el('div', 'board riderb');
  rb.append(el('div', 'lab', covers === 'fork' ? 'RIDER · FORK' : covers === 'shock' ? 'RIDER · SHOCK' : 'RIDER'), el('div', 'name', D.rider || 'Rider'));
  var label = D.bikeLabel || '', letter = '';
  var m = label.match(/\(([A-Za-z0-9]{1,3})\)\s*$/); if (m) { letter = m[1].toUpperCase(); label = label.replace(m[0], '').trim(); }
  var bl = el('div', 'bikeline'); if (letter) bl.appendChild(el('span', 'badge', letter));

        var val = x[0] === 'spring' ? fmtSpring(part, vals[x[0]], u) : vals[x[0]];

  if (covers !== 'fork') board('shock', 'SHOCK', D.shock, [['compLow', 'LOW SPD COMP', ''], ['compHigh', 'HIGH SPD COMP', 'turns'], ['reb', 'REB', '']], [['spring', 'Spring', 'N/mm'], ['raceSag', 'Race sag', 'mm'], ['preload', 'Preload', 'mm']], '');
