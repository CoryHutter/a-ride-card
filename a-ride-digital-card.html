<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A-Ride Suspension — Cory Hutter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --navy: #080b24;
    --navy-deep: #04061a;
    --gold-a: #c9932e;
    --gold-b: #f3d47e;
    --cream: #f2ead6;
    --steel: #b8bcc8;
    --line: rgba(243,212,126,0.25);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background: radial-gradient(circle at 50% -10%, #101538 0%, var(--navy-deep) 60%, #020310 100%);
    font-family:'Inter', sans-serif;
    color: var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    position:relative;
  }

  /* faint concentric ring motif echoing the A-Ride mark, bleeding off canvas */
  .stage::before{
    content:"";
    position:absolute;
    width:900px;
    height:900px;
    border-radius:50%;
    border:1px solid var(--line);
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  .stage::after{
    content:"";
    position:absolute;
    width:1140px;
    height:1140px;
    border-radius:50%;
    border:1px solid rgba(243,212,126,0.10);
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }

  .card{
    position:relative;
    width:100%;
    max-width:380px;
    background: linear-gradient(180deg, #0c1030 0%, #070a20 100%);
    border:1px solid var(--line);
    border-radius:28px;
    padding:40px 32px 32px;
    text-align:center;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.7),
      0 0 0 1px rgba(255,255,255,0.02) inset;
    animation: rise 0.7s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .mark{
    width:160px;
    height:160px;
    margin:0 auto 22px;
    border-radius:24px;
    overflow:hidden;
    box-shadow: 0 8px 24px -8px rgba(201,147,46,0.35);
    border:1px solid var(--line);
  }
  .mark img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .brand{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:4px;
    text-transform:uppercase;
    background: linear-gradient(90deg, var(--gold-a), var(--gold-b));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .brand-sub{
    font-family:'Oswald', sans-serif;
    font-weight:400;
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    color: var(--steel);
    margin-top:4px;
  }

  .divider{
    width:40px;
    height:1px;
    background: linear-gradient(90deg, transparent, var(--gold-a), transparent);
    margin:22px auto;
  }

  .name{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:28px;
    letter-spacing:0.5px;
    color: var(--cream);
  }

  .role{
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color: var(--gold-b);
    margin-top:6px;
    font-weight:500;
  }

  .actions{
    margin-top:28px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    text-decoration:none;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14.5px;
    letter-spacing:0.2px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:active{ transform: scale(0.98); }

  .btn-primary{
    background: linear-gradient(90deg, var(--gold-a), var(--gold-b));
    color: var(--navy-deep);
    box-shadow: 0 10px 24px -10px rgba(201,147,46,0.55);
  }

  .btn-secondary{
    background: rgba(255,255,255,0.04);
    color: var(--cream);
    border:1px solid var(--line);
  }

  .btn svg{ width:16px; height:16px; flex-shrink:0; }

  .footer-note{
    margin-top:26px;
    font-size:10.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color: rgba(184,188,200,0.55);
  }

  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; }
  }
</style>
</head>
